<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Webgnr intro video</title>
<link rel="stylesheet" href="./video.css">
<link rel="stylesheet" href="./scenes/intro.css">
<link rel="stylesheet" href="./scenes/brief.css">
<link rel="stylesheet" href="./scenes/site.css">
<link rel="stylesheet" href="./scenes/outro.css">
<script type="module" src="./main.js"></script>
</head>
<body>
<main id="stage">
  <section class="scene" data-scene="open" style="--s:0;--e:4">
    <div class="glow" aria-hidden="true"></div>
    <div class="exit" style="--out:3.55"><h1 class="open-line" data-copy="open.line" data-words-at="0.4" data-words-step="0.42"></h1></div>
  </section>
  <section class="scene light" data-scene="problem" style="--s:4;--e:9">
    <div class="wire" aria-hidden="true">
      <div class="wb wb-bar rise" style="--at:4.0;--fall:6.0;--r:-14deg"><i></i><i></i><i></i><b data-copy="problem.placeholders.3"></b></div>
      <div class="wb wb-head rise" style="--at:4.15;--fall:6.25;--r:9deg"><span data-copy="problem.placeholders.0"></span></div>
      <div class="wb wb-text rise" style="--at:4.3;--fall:6.4;--r:-6deg"><span data-copy="problem.placeholders.1"></span><i></i><i></i></div>
      <div class="wb wb-img rise" style="--at:4.45;--fall:6.15;--r:18deg"><svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 0L100 60M100 0L0 60"/></svg></div>
      <div class="wb wb-add rise" style="--at:4.6;--fall:6.55;--r:-20deg"><span data-copy="problem.placeholders.2"></span></div>
      <div class="wb wb-btn rise" style="--at:4.75;--fall:6.7;--r:24deg"><span data-copy="problem.placeholders.4"></span></div>
    </div>
    <h2 class="problem-line" data-copy="problem.line" data-words-at="6.6" data-words-step="0.3"></h2>
  </section>
  <section class="scene" data-scene="reveal" style="--s:9;--e:13">
    <svg class="route" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path class="route-line" pathLength="1" d="M-40 950 C 260 950 360 730 620 780 S 900 990 1120 890 S 1420 710 1700 810 S 1900 910 1980 870"/>
      <circle class="stop pop" style="--at:9.45" cx="620" cy="780" r="14"/>
      <circle class="stop pop" style="--at:9.85" cx="1120" cy="890" r="14"/>
      <circle class="stop pop" style="--at:10.25" cx="1700" cy="810" r="14"/>
    </svg>
    <div class="lockup">
      <div class="mark pop" style="--at:10.3"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4.5h12M3 9h12M3 13.5h8"/></svg></div>
      <div class="wordmark rise" style="--at:10.55">Webgnr</div>
    </div>
    <p class="reveal-tag rise" style="--at:11.2" data-copy="reveal.tag"></p>
  </section>
  <section class="scene light" data-scene="brief" style="--s:13;--e:22">
    <div class="exit" style="--out:21.45">
      <div class="brief-card rise" style="--at:13.1">
        <div class="brief-head"><span class="leaf" aria-hidden="true"></span><strong data-copy="brief.business"></strong><span class="step">1 / 3</span></div>
        <div class="field"><label data-copy="brief.fields.0.label"></label><div class="input"><span data-copy="brief.fields.0.answer" data-type-at="14.0"></span></div></div>
        <div class="field"><label data-copy="brief.fields.1.label"></label><div class="input"><span data-copy="brief.fields.1.answer" data-type-at="15.8"></span></div></div>
        <div class="field"><label data-copy="brief.fields.2.label"></label><div class="input"><span data-copy="brief.fields.2.answer" data-type-at="17.6"></span></div></div>
        <div class="upload pop" style="--at:19.4"><span class="clip" aria-hidden="true">&#8593;</span><span data-copy="brief.upload"></span></div>
      </div>
    </div>
    <p class="caption on-light rise" style="--at:13.5" data-copy="brief.caption"></p>
  </section>
  <section class="scene" data-scene="story" style="--s:22;--e:30">
    <div class="exit" style="--out:25.0">
      <div class="parts">
        <div class="part pop" style="--at:22.15"><small data-copy="story.parts.0.label"></small><span data-copy="story.parts.0.text"></span></div>
        <div class="part pop" style="--at:22.45"><small data-copy="story.parts.1.label"></small><span data-copy="story.parts.1.text"></span></div>
        <div class="part pop" style="--at:22.75"><small data-copy="story.parts.2.label"></small><span data-copy="story.parts.2.text"></span></div>
        <div class="part pop" style="--at:23.05"><small data-copy="story.parts.3.label"></small><span data-copy="story.parts.3.text"></span></div>
      </div>
    </div>
    <h2 class="story-headline" data-copy="story.headline" data-words-at="25.4" data-words-step="0.28"></h2>
    <p class="caption rise" style="--at:22.5" data-copy="story.caption"></p>
  </section>
  <section class="scene tint" data-scene="site" style="--s:30;--e:40">
    <div class="browser rise" style="--at:30.0">
      <div class="chrome"><i></i><i></i><i></i>
        <div class="url"><span class="lock" aria-hidden="true"></span><span data-copy="site.domain" data-type-at="38.0" data-type-step="0.045"></span></div>
      </div>
      <div class="page">
        <nav class="g-nav rise" style="--at:30.35">
          <span class="g-logo"><span class="leaf" aria-hidden="true"></span>GreenLeaf</span>
          <span class="swap"><span class="sw-a" data-copy="site.nav.0"></span><span class="sw-b" data-copy="site.flippedNav.0"></span></span><span class="swap"><span class="sw-a" data-copy="site.nav.1"></span><span class="sw-b" data-copy="site.flippedNav.1"></span></span><span class="swap"><span class="sw-a" data-copy="site.nav.2"></span><span class="sw-b" data-copy="site.flippedNav.2"></span></span>
          <span class="lang"><b class="lang-a" data-copy="site.langFrom"></b><b class="lang-b" data-copy="site.langTo"></b><i class="lang-knob"></i></span>
        </nav>
        <div class="g-hero">
          <div class="g-copy">
            <div class="g-h">
              <h3 class="g-h1 rise h-orig" style="--at:30.65" data-copy="story.headline"></h3>
              <h3 class="g-h1 h-edit" data-copy="site.edited" data-type-at="34.75" data-type-step="0.03"></h3>
              <h3 class="g-h1 h-flip" data-copy="site.flipped"></h3>
              <div class="ring" aria-hidden="true"></div>
              <div class="toolbar" aria-hidden="true"><b>B</b><i>I</i><u>U</u><span>&#128279;</span></div>
            </div>
            <p class="g-sub rise swap" style="--at:30.95"><span class="sw-a" data-copy="site.heroSub"></span><span class="sw-b" data-copy="site.flippedSub"></span></p>
            <span class="g-btn rise swap" style="--at:31.15"><span class="sw-a" data-copy="site.button"></span><span class="sw-b" data-copy="site.flippedButton"></span></span>
          </div>
          <div class="g-art pop" style="--at:31.0" aria-hidden="true"><div class="loaf"></div><div class="loaf l2"></div><div class="sun"></div></div>
        </div>
        <div class="g-row">
          <div class="g-card rise" style="--at:31.6"></div><div class="g-card rise" style="--at:31.8"></div><div class="g-card rise" style="--at:32.0"></div>
        </div>
      </div>
      <svg class="cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2l17 9-7.5 1.8L9 20z"/></svg>
    </div>
    <p class="caption on-light rise" style="--at:30.6" data-copy="site.caption"></p>
  </section>
  <section class="scene" data-scene="followup" style="--s:40;--e:50">
    <div class="glow" aria-hidden="true" style="animation-delay:40s"></div>
    <div class="fu-grid">
      <div class="fu-card fu-form rise" style="--at:40.1">
        <strong data-copy="followup.formLabel"></strong>
        <div class="input"><span data-copy="followup.formEmail" data-type-at="40.7" data-type-step="0.05"></span></div>
        <span class="fu-btn"><span data-copy="followup.formButton"></span><i class="tick pop" style="--at:41.95" aria-hidden="true">&#10003;</i></span>
      </div>
      <div class="fu-card fu-list rise" style="--at:40.3">
        <strong data-copy="followup.listTitle"></strong>
        <div class="row new"><span class="avatar" aria-hidden="true">S</span><span data-copy="followup.contactName"></span><span class="tag" data-copy="followup.tag"></span></div>
        <div class="row ghost"><span class="avatar" aria-hidden="true"></span><i></i></div>
        <div class="row ghost"><span class="avatar" aria-hidden="true"></span><i></i></div>
      </div>
      <div class="fu-card fu-seq rise" style="--at:43.6">
        <div class="mail pop" style="--at:44.0"><b>1</b><span data-copy="followup.emails.0"></span></div>
        <div class="mail pop" style="--at:44.5"><b>2</b><span data-copy="followup.emails.1"></span></div>
        <div class="mail pop" style="--at:45.0"><b>3</b><span data-copy="followup.emails.2"></span></div>
      </div>
      <div class="fu-card fu-chart rise" style="--at:45.8">
        <strong data-copy="followup.chartLabel"></strong>
        <svg viewBox="0 0 400 140" preserveAspectRatio="none" aria-hidden="true">
          <path class="ln l1" pathLength="1" d="M0 120 C 60 112 90 96 140 92 S 230 66 280 54 S 360 30 400 20"/>
          <path class="ln l2" pathLength="1" d="M0 132 C 70 128 110 122 160 116 S 250 100 300 90 S 370 74 400 66"/>
        </svg>
      </div>
    </div>
    <p class="caption rise" style="--at:40.4" data-copy="followup.caption"></p>
  </section>
  <section class="scene" data-scene="triad" style="--s:50;--e:55">
    <div class="panel" style="--s:50;--e:51.5"><h2 class="triad-line" data-copy="triad.0" data-words-at="50.05" data-words-step="0.18"></h2></div>
    <div class="panel aqua" style="--s:51.5;--e:53"><h2 class="triad-line" data-copy="triad.1" data-words-at="51.55" data-words-step="0.18"></h2></div>
    <div class="panel" style="--s:53;--e:55"><h2 class="triad-line underline" data-copy="triad.2" data-words-at="53.05" data-words-step="0.18"></h2></div>
  </section>
  <section class="scene" data-scene="end" style="--s:55;--e:60">
    <div class="glow" aria-hidden="true" style="animation-delay:55s;animation-duration:5s"></div>
    <div class="end-stack">
      <div class="lockup end-lockup">
        <div class="mark pop" style="--at:55.1"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4.5h12M3 9h12M3 13.5h8"/></svg></div>
        <div class="wordmark rise" style="--at:55.3">Webgnr</div>
      </div>
      <span class="end-cta rise" style="--at:55.8" data-copy="end.cta"></span>
      <span class="end-url rise" style="--at:56.1" data-copy="end.url"></span>
    </div>
  </section>
</main>
</body>
</html>
